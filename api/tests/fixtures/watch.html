        <script>
        (function() {
            const minTime = 3000;
            const startTime = Date.now();
            const player = document.getElementById('main-video');
            const wrapper = document.getElementById('player-wrapper');
            const fsBtn = document.getElementById('custom-fs-btn');
            const fsExitBtn = document.getElementById('custom-fs-exit-btn');
            const fsHint = document.getElementById('fs-hint');
            
            const nextUrl = "https:\/\/animetadka.com\/ep\/3528c3e893f3\/";

            function finishLoading() {
                const now = Date.now();
                const elapsed = now - startTime;
                const execute = () => {
                    document.body.classList.add('content-ready');
                    if (fsBtn) fsBtn.style.display = 'flex'; 
                    // Show mobile hint for exactly 5 seconds
                    if (fsHint) {
                        setTimeout(() => { fsHint.classList.add('show'); }, 500); 
                        setTimeout(() => { fsHint.classList.remove('show'); }, 5500); 
                    }
                };
                if (elapsed >= minTime) { execute(); } 
                else { setTimeout(execute, minTime - elapsed); }
            }

            if (player) { player.onload = finishLoading; }
            setTimeout(finishLoading, 8000);

            // CUSTOM FULLSCREEN ENTER LOGIC (Using wrapper so overlays persist)
            if (fsBtn) {
                fsBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                        if (wrapper.requestFullscreen) { wrapper.requestFullscreen(); } 
                        else if (wrapper.webkitRequestFullscreen) { wrapper.webkitRequestFullscreen(); } 
                        else if (wrapper.msRequestFullscreen) { wrapper.msRequestFullscreen(); }
                    }
                    if (fsHint) fsHint.classList.remove('show');
                });
            }

            // CUSTOM FULLSCREEN EXIT LOGIC (Invisible Container)
            if (fsExitBtn) {
                fsExitBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (document.exitFullscreen) { document.exitFullscreen(); } 
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                });
            }

            // AUTO-ROTATE & UI TOGGLE LOGIC
            ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
                document.addEventListener(evt, handleFSChange);
            });

            function handleFSChange() {
                const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (isFS) {
                    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); } catch(e){}
                    if (fsHint) fsHint.classList.remove('show');
                    if (fsBtn) fsBtn.style.display = 'none'; // Hide enter button
                    if (fsExitBtn) fsExitBtn.style.display = 'block'; // Activate invisible exit hitbox
                } else {
                    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
                    if (fsBtn) fsBtn.style.display = 'flex'; // Show enter button
                    if (fsExitBtn) fsExitBtn.style.display = 'none'; // Hide exit hitbox
                    
                    // SQUISH GLITCH FIX
                    let ticks = 0;
                    let jiggle = setInterval(() => {
                        player.style.height = (ticks % 2 === 0) ? '99.5%' : '100%';
                        ticks++;
                        if (ticks > 15) clearInterval(jiggle);
                    }, 50);
                }
            }

            window.addEventListener("message", function(event) {
                // 1. BRIDGE LOGIC: Catch settings from parent (single-ep.php) and relay to iframe (CDN21)
                if (event.data && event.data.type === 'settings') {
                    if (player && player.contentWindow) {
                        const payload = {
                            type: 'settings',
                            autoSkip: { intro: event.data.autoSkipIntro, outro: event.data.autoSkipOutro },
                            autoNext: event.data.autoNext,
                            audioLanguage: event.data.audioLanguage || 'hin'
                        };
                        player.contentWindow.postMessage(payload, '*');
                    }
                }

                // 2. BRIDGE LOGIC: Relay completion from iframe (CDN21) UP to parent (single-ep.php)
                if (event.data === 'video_playback_completed') {
                    if (window.parent) {
                        window.parent.postMessage('video_playback_completed', '*');
                    }
                }

                // 3. LEGACY AUTO-NEXT LOGIC (Kept exactly as it was)
                let data = event.data;
                if (typeof data === "string") { try { data = JSON.parse(data); } catch (e) { return; } }
                
                const isAutoNext = localStorage.getItem('at_auto_next') === 'true';
                if (isAutoNext && (data.event === "complete" || data.type === "completed" || data.event === "auto-next")) {
                    if (nextUrl && nextUrl !== "") { window.top.location.href = nextUrl; }
                }
            });

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.onkeydown = e => {
                if (e.keyCode === 123 || (e.ctrlKey && [85, 73, 74, 83].includes(e.keyCode))) return false;
            };
        })();
        </script>
